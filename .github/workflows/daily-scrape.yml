name: Daily Douyin Hot Scrape

on:
  schedule:
    # 每天北京时间早上8点运行 (UTC时间 0点)
    - cron: '0 0 * * *'
  workflow_dispatch: # 允许你手动点击按钮触发

jobs:
  scrape-and-send:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Install tkcrawl
        run: |
          git clone https://github.com/Kitemanul/tkcrawl.git /tmp/tkcrawl
          cd /tmp/tkcrawl
          uv sync
          uv run playwright install --with-deps chromium

      - name: Run scraper
        run: |
          cd /tmp/tkcrawl
          sudo apt-get update && sudo apt-get install -y xvfb
          xvfb-run -a uv run tkcrawl search "热门" --type video --max-count 30 -o output/hot_videos.json

      - name: Send email with results
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.SMTP_SERVER }}
          server_port: ${{ secrets.SMTP_PORT }}
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          subject: "每日抖音热门视频数据 - ${{ github.run_id }}"
          to: ${{ secrets.RECIPIENT_EMAIL }}
          from: ${{ secrets.SMTP_USERNAME }}
          attachments: /tmp/tkcrawl/output/hot_videos.json
          body: |
            你好，
            这是今天抓取的抖音热门视频数据，详情请查看附件。
            抓取时间：${{ github.event.repository.updated_at }}
            数据条数：30条
